# 기존 HTTPS server 블록 안에 추가합니다. TLS 인증서는 별도로 설정하세요.
location = /snaplink { return 308 /snaplink/; }
location /snaplink/ {
    client_max_body_size 40m;
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}
location = /snaplink-slides { return 308 /snaplink-slides/; }
location ^~ /snaplink-slides/api/ {
    client_max_body_size 26m;
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_cache off;
}
location ^~ /snaplink-slides/media/ {
    alias /var/lib/snaplink-slides/media/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
}
location /snaplink-slides/ {
    root /var/www/html;
    index index.html;
    try_files $uri $uri/ =404;
}
